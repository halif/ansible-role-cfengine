---
- name: Converge
  hosts: all
  become: true
  vars:
    # Смоук-тест: бутстрапимся к самому себе, чтобы проверить именно
    # автоматизацию (репозиторий, установка, bootstrap-команда), а не
    # настоящую топологию хаб+клиенты на разных хостах — это по
    # аналогии с halif.tidb_cluster, задокументировано в README.
    cfengine_policy_server: "127.0.0.1"
  roles:
    - role: halif.cfengine
